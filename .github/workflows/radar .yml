name: Radar diario

on:
  schedule:
    - cron: "30 5 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el radar
        run: python main.py

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Radar $(date -u +'%Y-%m-%d %H:%M') [skip ci]"
          git push

      - name: Avisar por Issue si hay alertas nuevas
        if: hashFiles('data/alertas_nuevas.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Radar - nuevas oportunidades $(date -u +'%d/%m/%Y')" --body-file data/alertas_nuevas.md
